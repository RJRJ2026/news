name: Daily News Update

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 0:00 = 北京时间 8:00
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser

      - name: Build news
        run: python build_news.py

      - name: Commit & push
        run: |
          git config user.name "NewsBot"
          git config user.email "newsbot@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet && echo "无变化" || git commit -m "每日新闻更新 $(date +%Y-%m-%d)"
          git push
