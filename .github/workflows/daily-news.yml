name: Daily News Update

on:
  schedule:
    # 每天 6 个时间点（UTC），对应北京 8:00/12:00/16:00/20:00/0:00/4:00
    # GitHub 定时调度可能延迟或跳过，多时间点提高命中率
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser

      - name: Build news
        run: python build_news.py

      - name: Commit & push
        run: |
          git config user.name "NewsBot"
          git config user.email "newsbot@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet && echo "无变化，跳过" || git commit -m "每日新闻更新 $(date +%Y-%m-%d)"
          git push
